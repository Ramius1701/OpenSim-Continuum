name: OpenSim Continuum Build

on:
  push:
    branches:
      - master
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.xml'
      - 'prebuild.xml'
      - 'runprebuild.sh'
      - '.github/workflows/msbuildnet.yml'

  pull_request:
    branches:
      - master
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.xml'
      - 'prebuild.xml'
      - 'runprebuild.sh'
      - '.github/workflows/msbuildnet.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate solution
        run: bash ./runprebuild.sh

      - name: Build OpenSim Continuum
        run: dotnet build --configuration Release OpenSim.sln