[ContinuumEconomyService]
    Port = 18119
    DefaultBalance = 1000
    AllowRegionCredits = true
    CurrencyPurchaseEnabled = true
    DailyPurchaseLimit = 100
    WeeklyPurchaseLimit = 250
    MonthlyPurchaseLimit = 500
    MaximumBalance = 10000
    EstimatedCostPerUnit = 0.01
    SystemActorID = 11111111-1111-1111-1111-111111111111
    ; Test-only credential shared with the XML-RPC smoke-test process.
    RegionSharedSecret = CONTINUUM-ECONOMY-LOCAL-SMOKE-TEST-ONLY

[Database]
    StorageProvider = SQLite
    ConnectionString = "Data Source=continuum_economy_xmlrpc_test.sqlite;Version=3"
