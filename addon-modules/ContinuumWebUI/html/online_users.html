OnlineUsersText  Online Users
RegionNameText   Region Name

MoreInfoText     More Info

<div id="fullPage">
  <h2>{SystemName}: {OnlineUsersText}</h2>
  <p>This operational view is restricted to grid administrators.</p>

  <table id="online_users_list">
    <thead class="listhead">
      <tr>
        <th class="online_users_left"><p>{UserNameText}</p></th>
        <th class="online_users_right"><p>{RegionNameText}</p></th>
      </tr>
    </thead>

    <tbody>
      {UsersOnlineListArrayBegin}
        <tr>
          <td class="online_users_left"><a href="#" onclick="loadmodalcontent('webprofile-modal_profile', 'userid={UserID}'); return false;">{UserName}</a></td>
          <td class="online_users_right"><a href="#" onclick="loadmodalcontent('regionprofile-modal_profile', 'regionid={UserRegionID}'); return false;">{UserRegion}</a></td>
        </tr>
      {UsersOnlineListArrayEnd}

    </tbody>
  </table>
</div>

<script>
  $(document).ready(function(){
    $('#online_users_list').dataTable({
      "order": [[ 0, "asc" ]]
    });

  });
</script>
