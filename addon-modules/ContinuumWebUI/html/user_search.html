<!-- Resident directory search -->

<div class="col98" id="user_search_page">
  <h2>{UserSearchText}</h2>

  <form class="form form-inline" id="user_search_form" action="user_search.html" method="post">
    <div class="col-8 form-group">
      <label class="mr-2" for="username">{UserNameText}</label>
      <input class="form-control" style="width:300px" required minlength="2" name="username" id="username">
    </div>
    <div class="col-2 form-group">
      <a class="btn btn-success" onclick="submitpagesearch('user_search_form', 'user_search_page');">{Search}</a>
    </div>
  </form>

  <div class="div10"></div>
  {IfHaveDataBegin}
  <table class="table table-dark table-striped table-bordered" width="100%" id="user_search_result">
    <thead>
      <tr>
        <th>{UserNameText}</th>
        <th class="no-sort">Picture</th>
        <th>Account type</th>
        {IfCanEditBegin}
        <th class="no-sort">Administration</th>
        {IfCanEditEnd}
      </tr>
    </thead>
    <tbody>
      {UsersListArrayBegin}
      <tr>
        <td>
          <a title="{UserName}" href="#" onclick="loadmodalcontent('webprofile-modal_profile', 'userid={UserID}');">
            <span class="agentlink">{UserName}</span>
          </a>
        </td>
        <td><img title="{UserName} ({UserType})" src="{UserPictureURL}" alt="{UserName}" height="50"></td>
        <td>{UserType}</td>
        {IfCanEditBegin}
        <td><a href="#" onclick="loadusercontent('admin-user_edit', 'userid={UserID}');" title="Edit resident"><i class="fa fa-edit fa-lg"></i></a></td>
        {IfCanEditEnd}
      </tr>
      {UsersListArrayEnd}
    </tbody>
  </table>
  {IfHaveDataEnd}

  {IfNoDataBegin}
  <p class="info">{NoDetailsText}</p>
  {IfNoDataEnd}
</div>

<script>
  $(function() {
    $('#user_search_result').dataTable({
      "order": [[0, "asc"]],
      "aoColumnDefs": [{"bSortable": false, "aTargets": ["no-sort"]}],
      "oLanguage": {"sSearch": "Filter: "}
    });
  });
</script>
