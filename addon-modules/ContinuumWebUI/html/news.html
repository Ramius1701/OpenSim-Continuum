<section class="portal-workspace" aria-labelledby="grid-news-heading">
  <p class="portal-eyebrow">The latest from {SystemName}</p><h1 id="grid-news-heading">Community news</h1>
  <p>Updates and announcements from your grid team. {NewsCount} published articles.</p>
  <div class="portal-card-grid">
    {NewsRowsArrayBegin}
    <article class="portal-card"><p class="portal-date">{NewsDate}</p><h2>{NewsTitle}</h2><p class="portal-news-text">{NewsText}</p></article>
    {NewsRowsArrayEnd}
  </div>
  <nav class="portal-actions" aria-label="News pages">
    {IfNewsHasPreviousBegin}
    <button type="button" class="btn btn-outline-light" onclick="loadcontent('news', 'newsoffset={NewsPreviousOffset}');">Previous</button>
    {IfNewsHasPreviousEnd}
    {IfNewsHasNextBegin}
    <button type="button" class="btn btn-outline-light" onclick="loadcontent('news', 'newsoffset={NewsNextOffset}');">Next</button>
    {IfNewsHasNextEnd}
  </nav>
</section>
