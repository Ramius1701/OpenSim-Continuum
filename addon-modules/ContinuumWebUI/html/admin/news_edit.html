<section class="portal-workspace" aria-labelledby="news-heading">
  <p class="portal-eyebrow">Grid administration · Communications</p>
  <h1 id="news-heading">Edit news article</h1>
  <p>Unpublish an article to keep it as a draft. Concurrent edits require reloading.</p>
  <form id="edit_news_form" action="admin/news_edit.html" method="post" class="portal-editor">
    <input type="hidden" name="newsid" value="{NewsID}"><input type="hidden" name="revision" value="{NewsRevision}"><label for="news-title">Title</label>
    <input class="form-control" name="NewsTitle" id="news-title" value="{NewsTitle}" required maxlength="160" autocomplete="off">
    <label for="news-body">Article</label>
    <textarea class="form-control" name="NewsText" id="news-body" required maxlength="8192" rows="12" aria-describedby="news-format">{NewsText}</textarea>
    <p id="news-format">Plain text. Line breaks are preserved; HTML is displayed as text.</p>
    <label class="portal-check"><input type="checkbox" name="published" value="true" {NewsPublished}> Publish to the public news feed</label>
    <div class="portal-actions">
      <button type="button" class="btn btn-primary" onclick="submitupdate('edit_news_form', '', 'admin-news_manager');">Save changes</button>
      <button type="button" class="btn btn-outline-light" onclick="loadusercontent('admin-news_manager');">Cancel</button>
    </div>
  </form>
</section>
