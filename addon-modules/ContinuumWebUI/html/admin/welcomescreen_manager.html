<section class="portal-workspace" aria-labelledby="portal-heading-title">
<p class="portal-eyebrow">Grid administration</p><h1 id="portal-heading-title">Welcome content</h1>
<p>Changes apply to this portal. Text is displayed as plain text. Reload before saving if another administrator has made changes.</p>
<form id="portal_form" action="admin/welcomescreen_manager.html" method="post" class="portal-editor">
<input type="hidden" name="revision" value="{PortalRevision}">
<label for="portal-heading">Welcome heading</label>
<input class="form-control" id="portal-heading" name="heading" value="{PortalHeading}" required maxlength="160">
<label for="portal-intro">Introduction</label>
<textarea class="form-control" id="portal-intro" name="introduction" rows="4" required maxlength="2000">{PortalIntroduction}</textarea>
<label for="notice-title">Announcement title</label>
<input class="form-control" id="notice-title" name="noticeTitle" value="{PortalNoticeTitle}" maxlength="160">
<label for="notice-text">Announcement</label>
<textarea class="form-control" id="notice-text" name="noticeText" rows="6" maxlength="4000">{PortalNoticeText}</textarea>
<label><input type="checkbox" name="noticeEnabled" value="true" {PortalNoticeChecked}> Show announcement on the home page and viewer welcome screen</label>
<div class="portal-actions"><button type="button" class="btn btn-primary" onclick="submitupdate('portal_form', '', 'admin-welcome');">Save changes</button></div>
</form></section>
