<section class="portal-workspace" aria-labelledby="news-heading">
  <header class="portal-page-heading"><div><p class="portal-eyebrow">Grid administration · Communications</p><h1 id="news-heading">News management</h1><p>{NewsCount} articles, including drafts.</p></div>
    <button type="button" class="btn btn-primary" onclick="loadusercontent('admin-news_add');">Create article</button></header>
  <div class="portal-card-grid">
    {NewsRowsArrayBegin}
    <article class="portal-card"><span class="portal-badge">{NewsState}</span><h2>{NewsTitle}</h2><p class="portal-date">{NewsDate}</p><p class="portal-news-preview">{NewsText}</p>
      <div class="portal-actions"><button type="button" class="btn btn-outline-light" onclick="loadusercontent('admin-news_edit', 'newsid={NewsID}');">Edit article</button>
        <form id="delete-news-{NewsID}" action="admin/news_manager.html" method="post"><input type="hidden" name="newsid" value="{NewsID}"><input type="hidden" name="revision" value="{NewsRevision}"><input type="hidden" name="action" value="delete">
          <button type="button" class="btn btn-outline-danger" onclick="if(window.confirm('Permanently delete this article?')) submitupdate('delete-news-{NewsID}', '', 'admin-news_manager');">Delete</button></form>
      </div></article>
    {NewsRowsArrayEnd}
  </div>
  <nav class="portal-actions" aria-label="News pages">
    {IfNewsHasPreviousBegin}
    <button type="button" class="btn btn-outline-light" onclick="loadusercontent('admin-news_manager', 'newsoffset={NewsPreviousOffset}');">Previous</button>
    {IfNewsHasPreviousEnd}
    {IfNewsHasNextBegin}
    <button type="button" class="btn btn-outline-light" onclick="loadusercontent('admin-news_manager', 'newsoffset={NewsNextOffset}');">Next</button>
    {IfNewsHasNextEnd}
  </nav>
</section>
