<section class="portal-workspace" aria-labelledby="portal-heading-title">
<p class="portal-eyebrow">Grid administration</p><h1 id="portal-heading-title">Portal settings</h1>
<p>Changes apply to this portal. Text is displayed as plain text. Reload before saving if another administrator has made changes.</p>
<form id="portal_form" action="admin/settings_manager.html" method="post" class="portal-editor">
<input type="hidden" name="revision" value="{PortalRevision}">
<label for="support-text">Resident support instructions</label>
<textarea class="form-control" id="support-text" name="supportText" rows="8" required maxlength="4000">{PortalSupportText}</textarea>
<label><input type="checkbox" name="slideshow" value="true" {PortalSlideshowChecked}> Show the home page slideshow</label>
<p>Registration policy, grid identity, service addresses and credentials remain in the operator configuration.</p>
<div class="portal-actions"><button type="button" class="btn btn-primary" onclick="submitupdate('portal_form', '', 'admin-portal');">Save changes</button></div>
</form></section>
