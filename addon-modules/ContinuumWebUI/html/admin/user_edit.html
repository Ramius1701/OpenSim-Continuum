<!-- Edit user: native OpenSim account operations only -->

<div id="content">
  <div class="text-center">
    <h2>{SystemName}: {EdittingText} {UserName}</h2>
  </div>

  <div class="offset-md-1"><h3 class="text-left">{AdminSetUserTypeText}</h3></div>
  <p class="info">{AdminUserTypeInfoText}</p>
  <form class="form-inline" id="set_user_type_form" action="admin/user_edit.html" method="post">
    <div class="col-md-8 offset-md-2">
      <div class="row w-100">
        <div class="col">
          <select class="custom-select form-control" id="UserType" name="UserType">
            {UserTypeArrayBegin}
              <option value="{Index}" {selected}>{Value}</option>
            {UserTypeArrayEnd}
          </select>
        </div>
        <div class="col-3">
          <a class="btn btn-info" onclick="submitupdate('set_user_type_form', 'userid={UserID}&setusertype=true');">{SaveUpdates}</a>
        </div>
      </div>
    </div>
  </form>

  <div class="div20"></div>
  <div class="offset-md-1"><h3 class="text-left">{ChangeEmailText}</h3></div>
  <form class="form-inline" id="user_email_form" action="admin/user_edit.html" method="post">
    <div class="col-md-8 offset-md-2">
      <div class="row w-100">
        <label class="col-form-label" for="email">{NewEmailText}</label>
        <div class="col">
          <input class="form-control" style="width:300px" id="email" required name="email" type="email" maxlength="254" value="{EmailValue}">
        </div>
        <div class="col-3">
          <a class="btn btn-info" onclick="submitupdate('user_email_form', 'userid={UserID}&updateemail=true');">{SaveUpdates}</a>
        </div>
      </div>
    </div>
  </form>
</div>
