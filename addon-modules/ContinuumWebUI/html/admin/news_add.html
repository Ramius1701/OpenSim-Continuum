<section class="portal-workspace" aria-labelledby="news-heading">
  <p class="portal-eyebrow">Grid administration · Communications</p>
  <h1 id="news-heading">Create a news article</h1>
  <p>Share an announcement with your community. Save a draft or publish it to the grid news feed.</p>
  <form id="add_news_form" action="admin/news_add.html" method="post" class="portal-editor">
    <label for="news-title">Title</label>
    <input class="form-control" name="NewsTitle" id="news-title" required maxlength="160" autocomplete="off">
    <label for="news-body">Article</label>
    <textarea class="form-control" name="NewsText" id="news-body" required maxlength="8192" rows="12" aria-describedby="news-format"></textarea>
    <p id="news-format">Plain text. Line breaks are preserved; HTML is displayed as text.</p>
    <label class="portal-check"><input type="checkbox" name="published" value="true"> Publish to the public news feed</label>
    <div class="portal-actions">
      <button type="button" class="btn btn-primary" onclick="submitupdate('add_news_form', '', 'admin-news_manager');">Save article</button>
      <button type="button" class="btn btn-outline-light" onclick="loadusercontent('admin-news_manager');">Cancel</button>
    </div>
  </form>
</section>
