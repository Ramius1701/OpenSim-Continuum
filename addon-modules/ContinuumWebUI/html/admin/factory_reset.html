<section class="portal-workspace" aria-labelledby="reset-title">
<p class="portal-eyebrow">Grid administration</p><h1 id="reset-title">Restore portal defaults</h1>
<p>Restore the portal presentation or public navigation to the built-in defaults. News, accounts, regions, estates, service configuration and money are unaffected.</p>
<form id="portal_reset_form" action="admin/factory_reset.html" method="post" class="portal-editor">
<input type="hidden" name="revision" value="{PortalRevision}">
<label for="reset-scope">Settings to restore</label>
<select class="form-control" id="reset-scope" name="action"><option value="navigation">Public navigation</option><option value="presentation">Welcome content, announcement, support instructions and slideshow</option></select>
<label><input type="checkbox" name="confirm" value="true" required> I understand the selected portal customizations will be replaced.</label>
<div class="portal-actions"><button type="button" class="btn btn-danger" onclick="submitupdate('portal_reset_form', '', 'admin-portal-reset');">Restore defaults</button></div>
</form></section>
