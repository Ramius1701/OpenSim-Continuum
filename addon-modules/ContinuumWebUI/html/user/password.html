<section class="portal-workspace" aria-labelledby="password-heading">
  <p class="portal-eyebrow">Account security</p><h1 id="password-heading">Change your password</h1>
  <p>Choose a password you don't use on another service. Use 8–128 characters.</p>
  <form id="change_password" class="portal-editor" action="user/password.html" method="post" onsubmit="submitupdate('change_password', '', '{PasswordChangeNextPage}', event); return false;">
    <label for="password-current">Current password</label>
    <input class="form-control" id="password-current" name="password" type="password" autocomplete="current-password" required>
    <label for="password-new">New password</label>
    <input class="form-control" id="password-new" name="passwordnew" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
    <label for="password-confirm">Confirm new password</label>
    <input class="form-control" id="password-confirm" name="passwordconf" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
    {IfPasswordRecoveryEnabledBegin}
    <p>Changing your password signs out existing portal sessions. You'll be returned to log in.</p>
    {IfPasswordRecoveryEnabledEnd}
    <div class="portal-actions"><button class="btn btn-primary" type="submit">Update password</button>
      <button class="btn btn-outline-light" type="button" onclick="loadusercontent('userhome');">Cancel</button></div>
  </form>
</section>
