[ContinuumSearchService]
    Port = 18010
    RegistrationPath = "/search/register"
    SnapshotBatchSize = 2
    SnapshotIntervalSeconds = 60
    ConnectTimeoutSeconds = 2
    RequestTimeoutSeconds = 5
    AllowPrivateSnapshotHosts = true

[Database]
    StorageProvider = SQLite
    ConnectionString = "Data Source=ContinuumSearch-runtime-test.db;Version=3;"
